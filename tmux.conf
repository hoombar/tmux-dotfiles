unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Ember Noir: black surfaces with orange active accents.
# tmux-powerline overrides status-left/status-right after TPM loads; these
# values keep the config usable if the plugin is unavailable.
set -g status-style 'fg=#e6e1d9,bg=#0f0f0f'
set -g status-left '#[fg=#0f0f0f,bg=#ff9e3d,bold] #S #[fg=#ff9e3d,bg=#0f0f0f] |'
set -g status-right '#[fg=#8b8680]%H:%M #[fg=#ff9e3d]%d %b'
set -g window-status-current-style 'fg=#0f0f0f,bg=#ff9e3d,bold'
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=#8b8680,bg=#0f0f0f'
set -g window-status-format ' #I:#W '

# Inactive panes: muted foreground on black; active pane gets warm text.
set -g window-style 'fg=#8b8680,bg=#0f0f0f'
set -g window-active-style 'fg=#e6e1d9,bg=#0f0f0f'

# Borders follow the same orange/black palette.
set -g pane-border-style 'fg=#2a211b'
set -g pane-active-border-style 'fg=#ff9e3d'

#set -g window-style 'fg=colour244'
#set -g window-active-style 'fg=colour255'

set -g mouse on
set -g history-limit 10000
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

#set -g extended-keys on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'azorng/tmux-smooth-scroll'
set -g @plugin 'Nucc/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'laktak/extrakto'
set -g @extrakto_clip_mode 'tmux_osc52'
set -g @extrakto_clip_mode_order 'tmux_osc52 buffer'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'erikw/tmux-powerline'

run '~/.tmux/plugins/tpm/tpm'

bind-key -T copy-mode WheelUpPane send-keys -X -N 1 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 1 scroll-down
